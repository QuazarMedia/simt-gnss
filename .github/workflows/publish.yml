name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.1.0'
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check release secrets
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          missing=""
          [ -n "$CENTRAL_USERNAME" ] || missing="$missing CENTRAL_PORTAL_USERNAME"
          [ -n "$CENTRAL_PASSWORD" ] || missing="$missing CENTRAL_PORTAL_PASSWORD"
          [ -n "$SIGNING_KEY" ] || missing="$missing SIGNING_KEY"
          [ -n "$SIGNING_PASSWORD" ] || missing="$missing SIGNING_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # v4 already defaults to platform-tools; pinned explicitly so a future default change
          # cannot reintroduce "Failed to find package 'tools'".
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish to Maven Central
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAggregationToCentralPortal -PVERSION_NAME="${{ steps.version.outputs.value }}" --stacktrace

  release:
    name: create GitHub release
    # A tag push is the only thing that names a release a tag can point at; a
    # workflow_dispatch run publishes a version that may have no tag at all.
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::The release for $TAG already exists; leaving it untouched."
            exit 0
          fi

          # The body is this version's CHANGELOG section, so the release notes and
          # the changelog cannot drift apart. A tag cut before its section was
          # written degrades to the Maven Central line alone rather than failing.
          notes="$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && (/^## / || /^\[/) { exit }
            found && NF == 0 && !started { next }
            found { started = 1; print }
          ' CHANGELOG.md)"

          {
            if [ -n "$notes" ]; then
              printf '%s\n\n' "$notes"
            fi
            printf 'Published to Maven Central as `app.simt:gnss-core:%s` and `app.simt:gnss-android:%s`.\n' "$version" "$version"
          } > release-notes.md

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --verify-tag \
            --notes-file release-notes.md
